name: Convert original RAN X models to GLB and deploy preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'source_assets/**'
      - '.github/workflows/convert-x-models.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ran-model-conversion
  cancel-in-progress: false

jobs:
  convert-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout source assets
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Expand uploaded source asset bundles
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r bundle; do
            name="$(basename "${bundle%.zip}")"
            destination="source_assets/_bundles/$name"
            mkdir -p "$destination"
            unzip -oq "$bundle" -d "$destination"
            echo "Expanded $bundle into $destination"
          done < <(find source_assets -maxdepth 1 -type f -iname '*.zip' | sort)

      - name: Inspect original RAN animation BIN and CFG archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          mapfile -t archives < <(find source_assets -maxdepth 1 -type f -iname '*animation*.zip' | sort)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No animation ZIP found; skipping metadata inspection."
          else
            for archive in "${archives[@]}"; do
              python3 scripts/inspect-ran-animation-archives.py "$archive" \
                --out "logs/$(basename "${archive%.zip}")-animation-inspection.json"
            done
          fi

      - name: Decode and validate RAN2 animation BIN payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          mapfile -t archives < <(find source_assets -maxdepth 1 -type f -iname '*animation*.zip' | sort)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No animation ZIP found; skipping RAN2 decode probe."
          else
            for archive in "${archives[@]}"; do
              base="$(basename "${archive%.zip}")"
              python3 scripts/decode-ran2-animation-bins.py "$archive" \
                --output "logs/${base}-ran2-decode-validation.json"
            done
          fi

      - name: Install Assimp and DDS image support
        run: |
          sudo apt-get update
          sudo apt-get install -y assimp-utils python3-pil imagemagick

      - name: Convert every X model to GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p converted_glb logs public/models
          mapfile -t files < <(find source_assets -type f -iname '*.x' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .X files found anywhere under source_assets/" | tee logs/ERROR.txt
            exit 2
          fi
          assimp version | tee logs/assimp-version.txt
          failed=0
          for src in "${files[@]}"; do
            name="$(basename "${src}")"
            out="converted_glb/${name%.*}.glb"
            echo "Converting: ${src} -> ${out}"
            if assimp export "${src}" "${out}" -f glb2 >"logs/${name}.log" 2>&1 && [ -s "${out}" ]; then
              echo "OK ${src} -> ${out}" | tee -a logs/summary.txt
            else
              echo "FAILED: ${src}" | tee -a logs/summary.txt
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Convert DDS textures and make GLB browser-compatible
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, struct, subprocess

          source = Path("source_assets")
          out_dir = Path("public/models")
          out_dir.mkdir(parents=True, exist_ok=True)

          converted = 0
          for dds in source.rglob("*"):
              if dds.is_file() and dds.suffix.lower() == ".dds":
                  target = out_dir / (dds.stem + ".png")
                  try:
                      # DXT2 is the premultiplied-alpha variant of DXT3. Pillow
                      # supports DXT3, so rewrite the FourCC in a temp copy,
                      # decode, then un-premultiply RGB before writing PNG.
                      if dds.read_bytes()[84:88] == b"DXT2":
                          import tempfile
                          raw = bytearray(dds.read_bytes())
                          raw[84:88] = b"DXT3"
                          temp = Path(tempfile.gettempdir()) / (dds.stem + "_as_dxt3.dds")
                          temp.write_bytes(raw)
                          image = Image.open(temp).convert("RGBA")
                          pixels = []
                          for red, green, blue, alpha in image.getdata():
                              if alpha:
                                  pixels.append((min(255, red * 255 // alpha),
                                                 min(255, green * 255 // alpha),
                                                 min(255, blue * 255 // alpha), alpha))
                              else:
                                  pixels.append((0, 0, 0, 0))
                          image.putdata(pixels)
                      else:
                          image = Image.open(dds).convert("RGBA")
                      image.save(target, optimize=True)
                  except Exception as pillow_error:
                      result = subprocess.run(
                          ["magick", str(dds), "-alpha", "on", str(target)],
                          capture_output=True, text=True
                      )
                      if result.returncode != 0 or not target.exists():
                          raise RuntimeError(f"Cannot decode required DDS {dds}: Pillow={pillow_error}; ImageMagick={result.stderr}")
                  converted += 1
          if converted == 0:
              raise SystemExit("No DDS textures were converted")

          # The uploaded body package does not yet include the original face/hair
          # DDS atlas set. Supply temporary compatible fallbacks so the native
          # head meshes render instead of disappearing on 404 texture requests.
          skin_fallback = out_dir / "w1_bs_body.png"
          hair_fallback = out_dir / "w1_hair_fallback.png"
          if not hair_fallback.exists():
              Image.new("RGBA", (64, 64), (28, 24, 22, 255)).save(hair_fallback)
          for name in ["w1_face00.png", "w1_face01.png", "w1_face02.png", "w1_face03.png", "w1_face04.png"]:
              target = out_dir / name
              if not target.exists() and skin_fallback.exists():
                  import shutil
                  shutil.copy2(skin_fallback, target)
          # The alternate s_w1_head.x GLB references a face normal map that is
          # not present in the uploaded DDS set. Supply a neutral tangent-space
          # normal (RGB 128,128,255) so GLTFLoader does not fail the whole model.
          face_normal_fallback = out_dir / "w1_face01_n.png"
          if not face_normal_fallback.exists():
              Image.new("RGB", (64, 64), (128, 128, 255)).save(face_normal_fallback)
          for name in ["w1_hair00.png", "w1_hair02.png", "w1_hair03.png", "w1_hair04.png"]:
              target = out_dir / name
              if not target.exists():
                  import shutil
                  shutil.copy2(hair_fallback, target)

          for glb in Path("converted_glb").glob("*.glb"):
              raw = glb.read_bytes()
              if raw[:4] != b"glTF":
                  raise SystemExit(f"Invalid GLB header: {glb}")
              version, total = struct.unpack_from("<II", raw, 4)
              offset = 12
              chunks = []
              while offset < len(raw):
                  length, kind = struct.unpack_from("<I4s", raw, offset)
                  offset += 8
                  payload = raw[offset:offset+length]
                  offset += length
                  if kind == b"JSON":
                      doc = json.loads(payload.decode("utf-8").rstrip(" \\0"))
                      for item in doc.get("images", []):
                          uri = item.get("uri", "")
                          if uri.lower().endswith(".dds"):
                              item["uri"] = Path(uri).stem + ".png"
                      payload = json.dumps(doc, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
                      payload += b" " * ((4 - len(payload) % 4) % 4)
                  chunks.append((kind, payload))
              body = bytearray()
              for kind, payload in chunks:
                  body += struct.pack("<I4s", len(payload), kind)
                  body += payload
              result = b"glTF" + struct.pack("<II", version, 12 + len(body)) + body
              glb.write_bytes(result)

          import shutil
          shutil.copy2("converted_glb/m_ss_war.glb", out_dir / "ran-male-original.glb")
          shutil.copy2("converted_glb/s_m_a_zt.glb", out_dir / "ran-warrior-male-a.glb")
          shutil.copy2("converted_glb/s_m_f_zt.glb", out_dir / "ran-warrior-male-f.glb")
          # Publish the female underwear body as a separate candidate asset.
          # Do not replace the active female player until its head/body assembly is validated.
          shutil.copy2("converted_glb/s_w_bs.glb", out_dir / "ran-female-underwear-body.glb")
          shutil.copy2("converted_glb/s_w_face.glb", out_dir / "ran-female-face-source.glb")
          # Publish the alternate native female head candidate for direct comparison.
          female_head = Path("converted_glb/s_w1_head.glb")
          if female_head.is_file() and female_head.stat().st_size:
              shutil.copy2(female_head, out_dir / "ran-female-head-candidate.glb")
              print("Prepared female s_w1_head candidate GLB.")
          else:
              raise SystemExit("Required female head candidate s_w1_head.x was not converted.")
          # Publish the original female base-hair mesh when its source bundle is present.
          # It stays a separate GLB so the hair can be equipped/removed independently.
          female_hair = Path("converted_glb/s_w_hair00.glb")
          if female_hair.is_file() and female_hair.stat().st_size:
              shutil.copy2(female_hair, out_dir / "ran-female-hair.glb")
              print("Prepared independent female base-hair GLB.")
          print(f"Converted {converted} DDS textures and patched all GLB texture references.")
          PY

      - name: Split selected male base into body, face and hair GLBs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/split-selected-character-glbs.py

      - name: Inventory male and female character-part source models
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/inspect-character-parts.py
          cat logs/character-part-inventory.json

      - name: Validate warrior GLB structure and female animation rig
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          files = [
              Path("public/models/ran-male-original.glb"),
              Path("public/models/ran-warrior-male-a.glb"),
              Path("public/models/ran-warrior-male-f.glb"),
              Path("public/models/ran-female-underwear-body.glb"),
          ]
          for path in files:
              raw = path.read_bytes()
              if raw[:4] != b"glTF":
                  raise SystemExit(f"Bad GLB: {path}")
              length = struct.unpack_from("<I", raw, 12)[0]
              doc = json.loads(raw[20:20+length].decode("utf-8").rstrip(" "))
              skins = doc.get("skins", [])
              meshes = doc.get("meshes", [])
              if not meshes:
                  raise SystemExit(f"Missing mesh: {path}")
              # Some source accessory/face meshes are intentionally static;
              # the female underwear body must have a real skin and weights.
              if "female-underwear" in path.name and not skins:
                  raise SystemExit(f"Female underwear body has no skin: {path}")
              for mesh in meshes:
                  for primitive in mesh.get("primitives", []):
                      attrs = primitive.get("attributes", {})
                      if skins and ("JOINTS_0" not in attrs or "WEIGHTS_0" not in attrs or "TEXCOORD_0" not in attrs):
                          raise SystemExit(f"Missing skin weights or UVs: {path}")
              for image in doc.get("images", []):
                  if image.get("uri", "").lower().endswith(".dds"):
                      raise SystemExit(f"Unconverted DDS reference in {path}")
              print(f"PASS {path.name}: {len(meshes)} meshes, {len(skins[0]['joints'])} joints, {len(doc.get('images', []))} textures")
          PY

      - name: Upload converted models and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ran-x-to-glb-test
          path: |
            converted_glb/
            public/models/
            logs/
          if-no-files-found: error
          retention-days: 14

      - name: Publish converted GLBs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/ran-male-original.glb public/models/ran-male-body.glb public/models/ran-male-face.glb public/models/ran-male-hair.glb public/models/ran-warrior-male-a.glb public/models/ran-warrior-male-f.glb public/models/ran-female-underwear-body.glb public/models/ran-female-face-source.glb public/models/ran-female-head-candidate.glb public/models/ran-female-hair.glb public/models/*.png
          if [ -f public/models/ran-female-hair.glb ]; then git add public/models/ran-female-hair.glb; fi
          if ! git diff --cached --quiet; then
            git commit -m "Add converted original RAN warrior models and textures"
            git pull --rebase origin main
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static game preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy game preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Run live game preview in headless Chromium
        env:
          PREVIEW_URL: https://carmenykm-oss.github.io/PROJECT_RAN/
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/smoke-preview.mjs
          node scripts/smoke-female-underwear-preview.mjs
          node scripts/smoke-female-head-hair-preview.mjs

      - name: Upload game preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ran-warrior-game-preview
          path: preview-screenshots/
          if-no-files-found: ignore
          retention-days: 14
