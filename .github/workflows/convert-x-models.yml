name: Convert original RAN X models to GLB

on:
  workflow_dispatch:
  push:
    paths:
      - 'source_assets/**'
      - '.github/workflows/convert-x-models.yml'
      - 'scripts/convert-x-models.sh'

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source assets
        uses: actions/checkout@v4

      - name: Install Assimp
        run: |
          sudo apt-get update
          sudo apt-get install -y assimp-utils

      - name: Convert every X model to GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p converted_glb logs
          mapfile -d '' files < <(find source_assets -type f \\( -iname '*.x' \\) -print0 | sort -z)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .X files found anywhere under source_assets/" | tee logs/ERROR.txt
            exit 2
          fi
          assimp version | tee logs/assimp-version.txt
          for src in "${files[@]}"; do
            name="$(basename "${src}")"
            out="converted_glb/${name%.*}.glb"
            echo "Converting: ${src} -> ${out}"
            if assimp export "${src}" "${out}" -f glb2 >"logs/${name}.log" 2>&1 && [ -s "${out}" ]; then
              echo "OK ${src} -> ${out}" | tee -a logs/summary.txt
            else
              echo "FAILED: ${src}" | tee -a logs/summary.txt
            fi
          done
          mkdir -p converted_glb/textures
          find source_assets -type f \\( -iname '*.dds' \\) -exec cp -f {} converted_glb/textures/ \\;
          echo "Conversion attempted for ${#files[@]} X files. Check logs; GLB output still requires rig, weight, UV and texture validation."
      
      - name: Upload converted models and logs
        uses: actions/upload-artifact@v4
        with:
          name: ran-x-to-glb-test
          path: |
            converted_glb/
            logs/
          if-no-files-found: error
          retention-days: 14
