name: Test PROJECT RAN female rig

on:
  push:
    branches: [main]
    paths:
      - 'public/game.js'
      - 'public/character-animation.js'
      - 'public/ran-bin-animation-player.js'
      - 'public/animations/manifest.json'
      - 'scripts/test-ran-bin-animation-player.mjs'
      - 'scripts/extract-ran2-animation-clips.py'
      - 'scripts/decode-ran2-animation-bins.py'
      - 'scripts/test-decode-ran2-animation-bins.py'
      - 'public/models/ran-female.glb'
      - 'scripts/test-character-animation.mjs'
      - 'package.json'
      - '.github/workflows/test-rig.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test female GLB rig and action poses
        run: npm run test:animation
      - name: Set up Python for RAN BIN decoder tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test RAN BIN decoding and keyframe extraction
        run: python scripts/test-decode-ran2-animation-bins.py
      - name: Install Three.js runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Test original BIN player against female GLB skeleton
        run: node scripts/test-ran-bin-animation-player.mjs
      - name: Check browser game module syntax
        run: node --input-type=module --check < public/game.js
      - name: Check server syntax
        run: node --check server.js
