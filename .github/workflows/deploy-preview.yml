name: Deploy PROJECT RAN character preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install browser smoke test
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify original female character in game scene
        env:
          PREVIEW_URL: https://carmenykm-oss.github.io/PROJECT_RAN/
        run: node scripts/smoke-female-preview.mjs

      - name: Verify original male character and head in game scene
        env:
          PREVIEW_URL: https://carmenykm-oss.github.io/PROJECT_RAN/
        run: node scripts/smoke-male-preview.mjs

      - name: Verify male idle walk and run bone animation
        env:
          PREVIEW_URL: https://carmenykm-oss.github.io/PROJECT_RAN/
        run: node scripts/smoke-male-skinning-preview.mjs

      - name: Upload experimental male rebound-skinning screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ran-male-animation-preview
          path: preview-screenshots/male-rebound-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload male game preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ran-male-game-preview
          path: preview-screenshots/male-game-preview.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload female game preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ran-female-game-preview
          path: preview-screenshots/female-game-preview.png
          if-no-files-found: ignore
          retention-days: 14
